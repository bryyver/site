<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header__container container">
            <img src="img/лого.png" alt="" class="logo">
            <ul class="menu">
                <li class="menu__item">
                    <a href="#">
                        Главная
                    </a>
                </li>
                <li class="menu__item">
                    <a href="#about">
                        О нас
                    </a>
                </li>
                <li class="menu__item">
                    <a href="#video">
                        Видео
                    </a>
                </li>
                <li class="menu__item">
                    <a href="#gallery">
                        Галерея
                    </a>
                </li>
                <li class="menu__item">
                    <a href="contact.html">
                        Контакты
                    </a>
                </li>
            </ul>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero__container container">
                <img src="img/hero.jpg" alt="" class="hero__img">
                <div class="hero__info">
                    <h1 class="hero__title">
                        deadlock
                    </h1>
                    <p class="hero__text">
                        Deadlock — это многопользовательская компьютерная игра от компании Valve в жанре шутера от
                        третьего лица с элементами MOBA (как Dota 2 или Overwatch).
                    </p>
                </div>
            </div>
            <section class="about" id="about">
                <div class="about__container container">
                    <h2>
                        О нас
                    </h2>
                    <div class="about__content">
                        <div class="about__info">
                            <h3>
                                Рейтинг
                            </h3>
                            <div class="progres">
                                <div class="progres-1"></div>
                            </div>
                            <div class="progres">
                                <div class="progres-2"></div>
                            </div>
                            <div class="progres">
                                <div class="progres-3"></div>
                            </div>
                        </div>
                        <img src="img/about.jpg" alt="" class="about__img">
                    </div>
                </div>
            </section>
            <section class="video" id="video">
                <div class="video__container container">
                    <h2>
                        Видео
                    </h2>
                    <div class="video__content">
                        <iframe width="100%" height="500"
                            src="https://rutube.ru/play/embed/a918d82526ed1b5d2500000d3120b8c7/" style="border: none;"
                            allow="clipboard-write; autoplay" allowFullScreen>
                        </iframe>
                    </div>
                </div>
            </section>
            <section class="gallery" id="gallery">
                <div class="gallery__container container">
                    <h2>
                        Галерея
                    </h2>
                    <ul class="gallery__list">
                        <li class="gallery__item">
                            <img src="img/img1.jpg" alt="">
                        </li>
                        <li class="gallery__item">
                            <img src="img/img2.webp" alt="">
                        </li>
                        <li class="gallery__item">
                            <img src="img/img3.webp" alt="">
                        </li>
                        <li class="gallery__item">
                            <img src="img/img4.jpg" alt="">
                        </li>
                        <li class="gallery__item">
                            <img src="img/img5.jpg" alt="">
                        </li>
                        <li class="gallery__item">
                            <img src="img/img6.png" alt="">
                        </li>
                    </ul>
                </div>
            </section>
    </main>
    <footer id="contact">
        <div class="footer__container container">
            <div class="footer__content">
                <h3>
                    Андрей Коновал
                </h3>
                <p>
                    Сайт разработан в 2026г.
                </p>
            </div>
            <div class="footer__list">
                <img src="img/discord.png" alt="">
                <img src="img/telegram.webp" alt="">
                <img src="img/Steam.webp" alt="">
            </div>
        </div>
    </footer>
</body>

</html>
